<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Hexfront Rush</title>
<style>
  /* Lilita One, SIL Open Font License 1.1 (fonts/OFL-LilitaOne.txt). One weight: never fake a bold of it. */
  @font-face { font-family: "Lilita One"; src: url(fonts/LilitaOne-Regular.ttf) format("truetype"); font-display: swap; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1e293b; }
  body, body * {
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; touch-action: none;
  }
  body { font-family: "Lilita One", "Trebuchet MS", "Segoe UI", system-ui, sans-serif; font-synthesis: none; letter-spacing: .3px; color: #fff; overscroll-behavior: none; }
  /* results reveal: reason, title, chips, buttons pop in one after another */
  @keyframes pop { 0% { opacity: 0; transform: scale(.4); } 70% { opacity: 1; transform: scale(1.12); } 100% { transform: scale(1); } }
  #result.reveal > * { animation: pop .42s cubic-bezier(.2,.9,.3,1.3) both; }
  #result.reveal > :nth-child(2) { animation-delay: .12s; }
  #result.reveal .chip { animation: pop .38s cubic-bezier(.2,.9,.3,1.3) both; }
  #result.reveal .chip.b { animation-delay: .3s; } #result.reveal .chip.r { animation-delay: .42s; }
  #result.reveal > .row { animation-delay: .9s; }
  #result.reveal > #watchBtn { animation-delay: 1.05s; }
  #game { position: fixed; left: 0; top: 0; display: block; }
  .panel {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(15, 23, 42, 0.62); gap: 14px; padding: 20px; box-sizing: border-box; text-align: center;
  }
  .hidden { display: none !important; }
  .logo { font-size: clamp(38px, 9vmin, 76px); font-weight: 900; letter-spacing: 1px; line-height: 1;
    color: #fff; text-shadow: 0 4px 0 #1d4ed8, 0 8px 18px rgba(0,0,0,.5); }
  .logo span { color: #fca5a5; text-shadow: 0 4px 0 #b91c1c, 0 8px 18px rgba(0,0,0,.5); }
  .sub { font-size: clamp(14px, 3.2vmin, 20px); opacity: .9; font-weight: 700; }
  .btn {
    font: inherit; font-weight: 900; font-size: clamp(20px, 4.8vmin, 30px); color: #fff; cursor: pointer;
    border: none; border-radius: 18px; padding: 14px 40px; min-width: 220px;
    background: linear-gradient(#4ade80, #16a34a); box-shadow: 0 6px 0 #166534, 0 10px 20px rgba(0,0,0,.35);
    transition: transform .08s;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #166534; }
  .btn.blue { background: linear-gradient(#60a5fa, #2563eb); box-shadow: 0 6px 0 #1e3a8a, 0 10px 20px rgba(0,0,0,.35); font-size: clamp(16px, 3.8vmin, 22px); padding: 10px 28px; }
  .card { background: rgba(15, 23, 42, 0.94); border: 3px solid #93c5fd; border-radius: 20px; padding: 20px 22px; max-width: 520px; width: 100%; box-sizing: border-box; }
  .card h2 { margin: 0 0 10px; font-size: clamp(22px, 5vmin, 32px); }
  .card ol { text-align: left; margin: 0 0 16px; padding-left: 22px; font-size: clamp(14px, 3.4vmin, 18px); line-height: 1.45; font-weight: 700; }
  .card li { margin-bottom: 8px; }
  #resultTitle { font-size: clamp(40px, 10vmin, 72px); font-weight: 900; margin: 0; }
  #resultTitle.win { color: #93c5fd; } #resultTitle.lose { color: #fca5a5; } #resultTitle.draw { color: #fff; }
  .score { display: flex; gap: 18px; align-items: center; justify-content: center; font-size: clamp(26px, 6vmin, 40px); font-weight: 900; }
  .chip { min-width: 90px; padding: 8px 14px; border-radius: 14px; }
  .chip.b { background: #2563eb; } .chip.r { background: #dc2626; }
  .chip small { display: block; font-size: 13px; font-weight: 700; opacity: .85; }
  #muteBtn {
    position: fixed; right: 10px; bottom: 12px; width: 48px; height: 48px; border-radius: 14px; border: 2px solid rgba(255,255,255,.7);
    background: rgba(15,23,42,.75); cursor: pointer; z-index: 20; padding: 8px; box-sizing: border-box;
  }
  #muteBtn svg { width: 100%; height: 100%; display: block; }
  #muteBtn .x { display: none; }
  #muteBtn.muted .x { display: inline; }
  #muteBtn.muted .w { display: none; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #1e293b; font-size: 22px; font-weight: 800; z-index: 30; }
  #leaveBtn {
    position: fixed; right: 66px; bottom: 12px; width: 48px; height: 48px; border-radius: 14px; border: 2px solid rgba(255,255,255,.7);
    background: rgba(15,23,42,.75); cursor: pointer; z-index: 20; padding: 8px; box-sizing: border-box;
  }
  #leaveBtn svg { width: 100%; height: 100%; display: block; }
  #speedBtn {
    position: fixed; right: 122px; bottom: 12px; min-width: 48px; height: 48px; border-radius: 14px; border: 2px solid rgba(255,255,255,.7);
    background: rgba(15,23,42,.75); cursor: pointer; z-index: 20; padding: 0 8px; box-sizing: border-box; font: inherit; font-size: 20px; color: #fff;
  }
  .share { display: flex; align-items: center; gap: 8px; max-width: 420px; font-size: clamp(12px, 2.6vmin, 15px); opacity: .8; font-weight: 700; cursor: pointer; text-align: left; }
  .privacy { margin-top: -6px; font-size: clamp(11px, 2.3vmin, 13px); font-weight: 700; color: #93c5fd; opacity: .8; }
  .share input { width: 18px; height: 18px; margin: 0; flex: none; accent-color: #4ade80; cursor: pointer; }
  #online .card { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  #online .card h2 { margin: 0; }
  #onlineMsg { min-height: 1.3em; white-space: pre-line; }
  #onlineForm { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  #roomCode { font-size: clamp(56px, 14vmin, 96px); letter-spacing: 12px; color: #fde047; text-shadow: 0 4px 0 #a16207; line-height: 1; }
  #codeIn {
    font: inherit; font-size: clamp(22px, 5vmin, 30px); width: 5.2em; text-align: center; letter-spacing: 6px; text-transform: uppercase;
    padding: 8px 10px; border-radius: 14px; border: 3px solid #93c5fd; background: #0f172a; color: #fff; outline: none;
    -webkit-user-select: text; user-select: text; touch-action: auto;
  }
  #codeIn::placeholder { color: rgba(255,255,255,.35); letter-spacing: 2px; }
  .row.join { align-items: center; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
</style>
</head>
<body>

<div id="menu" class="panel hidden">
  <div class="logo">HEXFRONT <span>RUSH</span></div>
  <div class="sub" id="record"></div>
  <button class="btn" id="playBtn" data-t="play"></button>
  <button class="btn blue" id="onlineBtn" data-t="online"></button>
  <button class="btn blue" id="howBtn" data-t="howto"></button>
  <label class="share hidden" id="share"><input type="checkbox" id="shareIn"><span data-t="shareReplays"></span></label>
  <a class="privacy hidden" id="privacyLink" target="_blank" rel="noopener" data-t="privacy"></a>
</div>

<div id="online" class="panel hidden">
  <div class="card">
    <h2 data-t="online"></h2>
    <div class="sub" id="onlineMsg"></div>
    <div id="roomCode" class="hidden"></div>
    <div id="onlineForm">
      <button class="btn" id="createBtn" data-t="createRoom"></button>
      <div class="row join">
        <input id="codeIn" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text">
        <button class="btn blue" id="joinBtn" data-t="join"></button>
      </div>
    </div>
    <button class="btn blue" id="onlineBack" data-t="cancel"></button>
  </div>
</div>

<div id="howto" class="panel hidden">
  <div class="card">
    <h2 data-t="howto"></h2>
    <ol>
      <li data-t="how1"></li>
      <li data-t="how2"></li>
      <li data-t="how3"></li>
      <li data-t="how4"></li>
      <li data-t="how5"></li>
    </ol>
    <button class="btn" id="howtoOk" data-t="gotit"></button>
  </div>
</div>

<div id="result" class="panel hidden">
  <div class="sub" id="resultReason"></div>
  <h1 id="resultTitle"></h1>
  <div class="score">
    <div class="chip b" id="chipMe"><span id="resMe">0</span><small data-t="you"></small></div>
    <div class="chip r" id="chipFoe"><span id="resFoe">0</span><small data-t="rival"></small></div>
  </div>
  <div class="row">
    <button class="btn" id="againBtn" data-t="playAgain"></button>
    <button class="btn blue" id="menuBtn" data-t="menu"></button>
  </div>
  <button class="btn blue hidden" id="watchBtn" data-t="watchReplay"></button>
</div>

<button id="muteBtn" aria-label="Sound">
  <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 9h4l5-4v14l-5-4H4z" fill="#fff"/>
    <path class="w" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>
    <path class="x" d="M16 9l6 6M22 9l-6 6"/>
  </svg>
</button>

<button id="leaveBtn" class="hidden" aria-label="Leave">
  <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 21V4"/><path d="M5 4h12l-2.5 4L17 12H5" fill="#fca5a5"/>
  </svg>
</button>

<button id="speedBtn" class="hidden" aria-label="Replay speed">1×</button>

<div id="loading">Loading…</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
