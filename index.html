<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Hexfront Rush</title>
<style>
  /* The UI is the board's toy box (art/STYLE.md, UI): painted wooden pieces on a warm board.
     Planks of natural wood are the plain buttons, lacquered green the main one, gold a setting,
     cream boards the panels; blue and red appear only where they mean the teams.
     Lilita One, SIL Open Font License 1.1 (fonts/OFL-LilitaOne.txt). One weight: never fake a bold of it. */
  @font-face { font-family: "Lilita One"; src: url(fonts/LilitaOne-Regular.ttf) format("truetype"); font-display: swap; }
  :root {
    --ink: #3b2412; --wood-hi: #f3d6a4; --wood: #d9a865; --wood-lo: #a8743d; --wood-rim: #6e4320;
    --paper: #fbf1dc; --paper-lo: #f1e0bb; --leaf-hi: #8fd35c; --leaf: #58a332; --leaf-rim: #2f6418;
    --gold-hi: #ffd76a; --gold: #f0a92a; --gold-rim: #8f5a12; --star: #f2b01e;
    --team-b: #2563eb; --team-r: #dc2626;
    --grain: repeating-linear-gradient(100deg, rgba(110,67,32,0) 0 7px, rgba(110,67,32,.07) 7px 9px, rgba(110,67,32,0) 9px 17px, rgba(255,255,255,.06) 17px 18px);
    --gloss: radial-gradient(ellipse at 30% 15%, rgba(255,255,255,.42), rgba(255,255,255,0) 50%);
  }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #3a2a1c; }
  body, body * {
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; touch-action: none;
  }
  body { font-family: "Lilita One", "Trebuchet MS", "Segoe UI", system-ui, sans-serif; font-synthesis: none; letter-spacing: .3px; color: #fff; overscroll-behavior: none; }
  /* the languages Lilita One cannot write (i18n.ts systemFont): the system font at real weights */
  html:is([lang=zh],[lang=ja],[lang=ko],[lang=ru],[lang=tr],[lang=pl]) body { font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; font-weight: 800; font-synthesis: weight; }
  html:is([lang=zh],[lang=ja],[lang=ko],[lang=ru],[lang=tr],[lang=pl]) :is(.card h2, #resultTitle, #roomCode) { font-weight: 900; }
  /* results reveal: the board, then reason, title, chips, time, stars, stats, buttons one after another */
  @keyframes pop { 0% { opacity: 0; transform: scale(.4); } 70% { opacity: 1; transform: scale(1.12); } 100% { transform: scale(1); } }
  #result.reveal .card { animation: pop .36s cubic-bezier(.2,.9,.3,1.2) both; }
  #result.reveal .card > div > * { animation: pop .42s cubic-bezier(.2,.9,.3,1.3) both; }
  #result.reveal #resultReason { animation-delay: .08s; }
  #result.reveal #resultTitle { animation-delay: .16s; }
  #result.reveal .chip { animation: pop .38s cubic-bezier(.2,.9,.3,1.3) both; }
  #result.reveal .chip.b { animation-delay: .3s; } #result.reveal .chip.r { animation-delay: .42s; }
  #result.reveal .card #resTime { animation-delay: .5s; }
  #result.reveal .card .stars { animation-delay: .6s; }
  #result.reveal .stars .new b { animation: pop .5s cubic-bezier(.2,.9,.3,1.3) 1s both; }
  #result.reveal .card .stats { animation-delay: .75s; }
  #result.reveal .card .tip { animation-delay: .85s; }
  #result.reveal .card .row { animation-delay: .9s; }
  #result.reveal .card #watchBtn { animation-delay: 1.05s; }
  #result.reveal .card .achNew { animation-delay: 1.1s; }
  #game { position: fixed; left: 0; top: 0; display: block; }
  .panel {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 45%, rgba(40,24,10,.12), rgba(30,18,8,.6) 78%);
    gap: 14px; padding: 20px; box-sizing: border-box; text-align: center;
  }
  .hidden { display: none !important; }

  /* the title: carved letters in cream and red paint, standing between two of the toys */
  .title { display: flex; align-items: flex-end; justify-content: center; gap: clamp(2px, 1.5vmin, 16px); margin-bottom: 2px; }
  .title img { height: clamp(74px, 18vmin, 160px); width: auto; filter: drop-shadow(0 6px 5px rgba(0,0,0,.4)); }
  .title img.l { animation: bob 2.6s ease-in-out infinite; }
  .title img.r { animation: bob 2.6s ease-in-out -1.3s infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-6px) rotate(2deg); } }
  .logo { font-family: "Lilita One", "Trebuchet MS", sans-serif; font-synthesis: none; font-size: clamp(34px, 8.5vmin, 74px); letter-spacing: 1px; line-height: .95; color: #fff6e2; font-weight: 400; padding-bottom: 8px;
    -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill;
    text-shadow: 0 1px 0 #e9c48c, 0 2px 0 #c8955a, 0 3px 0 #a8743d, 0 4px 0 #8a5a2b, 0 5px 0 var(--wood-rim), 0 7px 0 var(--ink), 0 12px 16px rgba(0,0,0,.5); }
  .logo span { display: block; color: #ef5a3c; font-size: 1.2em;
    text-shadow: 0 1px 0 #d8452a, 0 2px 0 #c03a22, 0 3px 0 #a3301b, 0 4px 0 #862713, 0 5px 0 #6b1d0c, 0 7px 0 var(--ink), 0 12px 16px rgba(0,0,0,.5); }
  .sub { font-size: clamp(14px, 3.2vmin, 20px); opacity: .95; }
  .panel > .sub { text-shadow: 0 2px 0 var(--ink), 0 0 8px rgba(0,0,0,.6); }

  /* buttons: lacquered green (the main action), natural wood (the rest), gold (a setting) */
  .btn {
    font: inherit; font-size: clamp(20px, 4.8vmin, 30px); color: #fff; cursor: pointer;
    border: 3px solid var(--leaf-rim); border-radius: 16px; padding: 11px 40px; min-width: 220px;
    background: var(--gloss), linear-gradient(var(--leaf-hi), var(--leaf));
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.18), 0 6px 0 var(--leaf-rim), 0 10px 16px rgba(0,0,0,.35);
    text-shadow: 0 2px 0 var(--leaf-rim), 0 -1px 0 var(--leaf-rim), 1px 0 0 var(--leaf-rim), -1px 0 0 var(--leaf-rim);
    transition: transform .08s;
  }
  .btn:active { transform: translateY(4px); box-shadow: inset 0 -4px 0 rgba(0,0,0,.18), 0 2px 0 var(--leaf-rim); }
  .btn.wood, .btn.small { color: var(--ink); font-size: clamp(16px, 3.8vmin, 22px); padding: 9px 24px; text-shadow: 0 1px 0 rgba(255,255,255,.5); }
  .btn.wood { border-color: var(--wood-rim);
    background: var(--gloss), var(--grain), linear-gradient(var(--wood-hi), var(--wood));
    box-shadow: inset 0 -4px 0 rgba(110,67,32,.25), 0 6px 0 var(--wood-rim), 0 10px 16px rgba(0,0,0,.35); }
  .btn.wood:active { box-shadow: inset 0 -4px 0 rgba(110,67,32,.25), 0 2px 0 var(--wood-rim); }
  .btn.small { min-width: 0; padding: 9px 18px; border-color: var(--gold-rim);
    background: var(--gloss), linear-gradient(var(--gold-hi), var(--gold));
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.12), 0 6px 0 var(--gold-rim), 0 10px 16px rgba(0,0,0,.35); }
  .btn.small:active { box-shadow: 0 2px 0 var(--gold-rim); }
  #menu .row .btn.wood { min-width: 0; }
  /* the brief's rewarded-ad offer: labelled as an ad (the screen icon and the text say so) */
  .btn.boost { display: inline-flex; align-items: center; gap: 8px; margin: 0 auto 14px; font-size: clamp(14px, 3.2vmin, 18px); }
  .btn.boost svg { width: 1.4em; height: 1.4em; flex: none; }
  .btn.boost.on { background: var(--gloss), linear-gradient(#c9eaa8, #9fd27a); border-color: var(--leaf-rim); box-shadow: 0 3px 0 var(--leaf-rim); cursor: default; }
  .btn.boost:disabled:not(.on) { opacity: .6; }

  /* panels: a cream board in a wooden frame */
  .card { color: var(--ink); background: var(--grain), linear-gradient(var(--paper), var(--paper-lo));
    border: 6px solid var(--wood-lo); border-radius: 22px; padding: 20px 22px;
    box-shadow: 0 0 0 3px var(--wood-rim), inset 0 0 0 3px rgba(255,255,255,.55), inset 0 -10px 24px rgba(168,116,61,.18), 0 12px 0 var(--wood-rim), 0 18px 30px rgba(0,0,0,.45);
    max-width: 520px; width: 100%; box-sizing: border-box; max-height: calc(100% - 30px); overflow: auto; }
  .card h2 { margin: 0 0 10px; font-size: clamp(22px, 5vmin, 32px); color: var(--wood-rim); font-weight: 400; }
  .card .sub { color: #6b4a2e; }
  .card ol { text-align: left; margin: 0 0 16px; padding-left: 22px; font-size: clamp(14px, 3.4vmin, 18px); line-height: 1.45; }
  .card li { margin-bottom: 8px; }
  /* how to play: on a screen too short for all five rules, the list scrolls and "Got it" stays in view */
  #howto .card { display: flex; flex-direction: column; }
  #howto .howScroll { flex: 0 1 auto; min-height: 0; overflow-y: auto; padding-bottom: 10px;
    -webkit-mask-image: linear-gradient(#000 calc(100% - 16px), transparent); mask-image: linear-gradient(#000 calc(100% - 16px), transparent); }
  #howto ol { margin-bottom: 0; }
  #howto .card > .btn { flex: none; align-self: center; margin-top: 6px; }
  .card li::marker { color: var(--leaf); }
  #resultTitle { font-size: clamp(40px, 10vmin, 72px); margin: 0; font-weight: 400; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill;
    text-shadow: 0 4px 0 var(--ink), 0 8px 14px rgba(0,0,0,.25); line-height: 1.05; }
  /* the results board */
  .card.res { display: flex; flex-direction: column; align-items: center; gap: 10px; max-width: 480px; }
  .card.res > div { display: flex; flex-direction: column; align-items: center; gap: inherit; min-width: 0; }
  .card.res .sub { margin: 0; }
  .card.res .row .btn { min-width: 0; padding: 9px 22px; font-size: clamp(17px, 4vmin, 24px); }
  .card.res #watchBtn { min-width: 0; padding: 7px 20px; font-size: clamp(15px, 3.4vmin, 20px); }
  #resTime { font-size: clamp(13px, 3vmin, 17px); color: #6b4a2e; }
  .stats { border-collapse: collapse; font-size: clamp(13px, 3vmin, 16px); min-width: 74%; }
  .stats th, .stats td { padding: 3px 12px; font-weight: inherit; }
  .stats tr:nth-child(even) { background: rgba(120,72,30,.09); }
  .stats tr > th:first-child { text-align: left; color: #6b4a2e; }
  .stats th.b { color: var(--team-b); } .stats th.r { color: var(--team-r); }
  .stats td { text-align: center; color: rgba(59,36,18,.6); min-width: 3em; }
  .stats td.up.b { color: var(--team-b); } .stats td.up.r { color: var(--team-r); }
  .achNew { display: flex; flex-direction: column; gap: 4px; font-size: clamp(14px, 3.2vmin, 18px); }
  .achNew div { display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .achNew b { font-weight: inherit; color: var(--gold-rim); }
  .medal { width: 1.6em; height: 1.6em; flex: none; }
  .card .stars div { text-shadow: none; }
  .card .stars b { color: rgba(110,67,32,.2); }
  .card .stars .had b { color: rgba(242,176,30,.55); }
  /* the pause menu */
  .card.narrow { max-width: 340px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .card.narrow h2 { margin: 0; }
  .col { display: flex; flex-direction: column; gap: 14px; align-items: stretch; }
  /* the leaderboard's tabs */
  .tabs { display: flex; gap: 8px; justify-content: center; margin: 0 0 8px; }
  .tab { font: inherit; font-size: clamp(14px, 3.2vmin, 18px); color: var(--ink); padding: 6px 16px; border-radius: 14px; cursor: pointer; opacity: .7;
    border: 3px solid var(--wood-rim); background: var(--grain), linear-gradient(var(--wood-hi), var(--wood)); box-shadow: 0 3px 0 var(--wood-rim); }
  .tab.on { opacity: 1; border-color: var(--gold-rim); background: var(--gloss), linear-gradient(var(--gold-hi), var(--gold)); box-shadow: 0 3px 0 var(--gold-rim); }
  /* the achievements */
  #achBtn { display: inline-flex; align-items: center; gap: 8px; }
  #achBtn .medal { width: 1.3em; height: 1.3em; }
  .achGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0 16px; }
  .achGrid .a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px; border-radius: 12px; background: rgba(120,72,30,.09); }
  .achGrid .medal { width: 40px; height: 40px; filter: grayscale(1); opacity: .3; }
  .achGrid .on .medal { filter: none; opacity: 1; }
  .achGrid b { font-weight: inherit; font-size: clamp(13px, 3vmin, 16px); }
  .achGrid .a:not(.on) b { opacity: .55; }
  .achGrid span { font-size: clamp(11px, 2.4vmin, 13px); color: #6b4a2e; line-height: 1.2; }
  /* middling screens: the results board is drawn a little tighter so it fits without scrolling */
  @media (max-height: 820px) {
    #resultTitle { font-size: clamp(34px, 8vmin, 56px); }
    .card.res { gap: 7px; }
    .card.res .stars b { font-size: 38px; }
    .stats th, .stats td { padding: 2px 12px; }
    /* the brief: its two buttons side by side and the lists tighter, so a boss stage's five twists leave "Fight!" on screen */
    #brief .card > .row { flex-wrap: nowrap; }
    #brief .card > .row .btn { min-width: 0; flex: 1 1 0; padding-left: 12px; padding-right: 12px; }
    #brief .twists, #brief .goals { margin: 8px 0; line-height: 1.25; }
    #brief .twists li, #brief .goals li { margin-bottom: 5px; }
    /* the achievements: the medals scroll and "Back" stays in view */
    #ach .card { display: flex; flex-direction: column; }
    #ach .achGrid { flex: 0 1 auto; min-height: 0; overflow-y: auto; padding-bottom: 8px;
      -webkit-mask-image: linear-gradient(#000 calc(100% - 14px), transparent); mask-image: linear-gradient(#000 calc(100% - 14px), transparent); }
    #ach .card > .btn { flex: none; align-self: center; }
  }
  /* short screens (a phone held sideways): smaller pieces, the boards scroll */
  @media (max-height: 560px) and (min-aspect-ratio: 5/4) {
    /* the results side by side: the score on the left, the stats and the buttons on the right */
    .card.res { flex-direction: row; align-items: center; justify-content: center; max-width: 760px; }
    .card.res > div { flex: 1 1 0; }
    .card.res > div + div { margin-left: 14px; }
    #ach .card { max-width: 760px; }
    #ach .achGrid { grid-template-columns: repeat(5, 1fr); margin: 4px 0 8px; }
    /* the achievements: the title and the count on one line, smaller medals, so ten long names fit above "Back" */
    #ach .card { display: block; }
    #ach .achGrid { overflow: visible; -webkit-mask-image: none; mask-image: none; }
    #ach h2, #ach .sub { display: inline-block; vertical-align: baseline; margin: 0; }
    #ach .sub { margin-left: 12px; }
    #ach .achGrid .a { padding: 3px 4px; gap: 1px; }
    #ach .achGrid .medal { width: 24px; height: 24px; }
    /* the brief in two columns: the rival and the twists on the left; the goals, the tip and the buttons on the right
       (a late stage has five twists: the buttons under both columns would fall below a phone's edge) */
    #brief .card { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto auto auto auto auto auto 1fr; column-gap: 18px; align-content: start; max-width: 760px; }
    #brief .card > * { grid-column: 1 / -1; }
    #brief .card > .rival { grid-column: 1; grid-row: 4; margin: 6px 0 2px; }
    #brief .card > .twists { grid-column: 1; grid-row: 5 / span 3; margin: 4px 0; font-size: 13px; line-height: 1.22; }
    #brief .card > .goals { grid-column: 2; grid-row: 4; margin: 6px 0; align-self: center; }
    #brief .card > .tip { grid-column: 2; grid-row: 5; margin: 2px 0 6px; }
    #brief .card > .boost { grid-column: 2; grid-row: 6; justify-self: center; }
    #brief .card > .row { grid-column: 2; grid-row: 7; align-self: end; margin-top: 4px; flex-wrap: nowrap; gap: 10px; }
    #brief .card > .row .btn { min-width: 0; flex: 1 1 0; padding: 8px 12px; }
    /* how to play: the five rules in two columns, so "Got it" stays on screen */
    #howto .card { max-width: 780px; }
    #howto h2 { margin-bottom: 4px; }
    #howto ol { columns: 2; column-gap: 30px; font-size: 13.5px; line-height: 1.26; }
    #howto li { break-inside: avoid; margin-bottom: 5px; }
    /* the campaign: a chapter's seven stages in one row, so the Normal/Hard tabs and "Menu" still fit */
    #campaign .card { max-width: 760px; }
    #campaign .stages { grid-template-columns: repeat(7, 1fr); gap: 8px; margin: 10px 0 12px; }
    #campaign .tabs { margin-bottom: 4px; }
    /* settings: the graphics label beside its tabs */
    #settings .card { max-width: 560px; }
    #settings .opts { gap: 6px; }
    #settings .opt.q { flex-direction: row; align-items: center; gap: 12px; }
    #settings .opt.q .tabs { flex: 1; }
  }
  @media (max-height: 560px) {
    #resultTitle { font-size: clamp(30px, 9vmin, 44px); }
    .card.res { gap: 6px; }
    .score { font-size: 22px; } .chip { min-width: 70px; padding: 4px 10px; }
    .stars b { font-size: 32px; }
    .stats th, .stats td { padding: 1px 10px; }
    .achGrid .medal { width: 28px; height: 28px; }
    .achGrid { gap: 5px; margin: 6px 0 10px; }
    .card { padding: 12px 16px; }
  }
  #resultTitle.win { color: #93c5fd; } #resultTitle.lose { color: #fca5a5; } #resultTitle.draw { color: #fff6e2; }
  .score { display: flex; gap: 18px; align-items: center; justify-content: center; font-size: clamp(26px, 6vmin, 40px); }
  .chip { min-width: 90px; padding: 8px 14px; border-radius: 16px; border: 3px solid var(--ink); text-shadow: 0 2px 0 rgba(0,0,0,.35);
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.2), 0 5px 0 var(--ink); }
  .chip.b { background: var(--gloss), var(--team-b); } .chip.r { background: var(--gloss), var(--team-r); }
  .chip small { display: block; font-size: 13px; opacity: .9; }

  /* the corner buttons: round wooden tokens */
  #muteBtn, #musicBtn, #pauseBtn, #leaveBtn, #speedBtn {
    position: fixed; bottom: 12px; width: 50px; height: 50px; border-radius: 50%; border: 3px solid var(--wood-rim);
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.45), rgba(255,255,255,0) 45%), var(--grain), radial-gradient(circle, var(--wood-hi), var(--wood) 72%);
    box-shadow: inset 0 -3px 0 rgba(110,67,32,.3), 0 4px 0 var(--wood-rim), 0 6px 10px rgba(0,0,0,.35);
    color: var(--ink); cursor: pointer; z-index: 20; padding: 10px; box-sizing: border-box;
  }
  #muteBtn { right: 10px; } #leaveBtn, #pauseBtn, #musicBtn { right: 68px; }
  #speedBtn { right: 126px; min-width: 50px; width: auto; border-radius: 25px; padding: 0 12px; font: inherit; font-size: 20px; }
  #muteBtn:active, #musicBtn:active, #pauseBtn:active, #leaveBtn:active, #speedBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--wood-rim); }
  #muteBtn svg, #musicBtn svg, #pauseBtn svg, #leaveBtn svg { width: 100%; height: 100%; display: block; }
  #muteBtn .x, #musicBtn .x { display: none; }
  #muteBtn.muted .x, #musicBtn.muted .x { display: inline; }
  #muteBtn.muted .w { display: none; }
  #musicBtn.muted .n { opacity: .45; }

  /* loading: the board's wood, the title, a carved groove filling up */
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 26px; align-items: center; justify-content: center; text-align: center; z-index: 30;
    background: var(--grain), radial-gradient(ellipse at 50% 40%, #8a6440, #3a2a1c 80%); }
  #loading .bar { width: min(260px, 60vw); height: 16px; border-radius: 10px; background: #2a1a0c; border: 3px solid var(--wood-rim); overflow: hidden;
    box-shadow: inset 0 3px 4px rgba(0,0,0,.5), 0 2px 0 rgba(255,255,255,.15); }
  #loading .bar i { display: block; height: 100%; width: 40%; border-radius: 6px; background: linear-gradient(var(--leaf-hi), var(--leaf));
    animation: load 1.2s ease-in-out infinite alternate; }
  @keyframes load { from { margin-left: 0; } to { margin-left: 60%; } }

  /* the settings */
  .btn.icon { padding: 9px 14px; display: inline-flex; align-items: center; }
  .btn .gear { width: 1.3em; height: 1.3em; }
  .opts { display: flex; flex-direction: column; gap: 12px; align-self: stretch; text-align: left; font-size: clamp(15px, 3.4vmin, 19px); }
  .opt { display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; }
  .opt.q { flex-direction: column; align-items: stretch; gap: 6px; cursor: default; }
  .opt.q .tabs { margin: 0; }
  .opt.q .tab { flex: 1; padding: 6px 8px; }
  .sw { appearance: none; -webkit-appearance: none; flex: none; width: 52px; height: 30px; margin: 0; border-radius: 15px; position: relative; cursor: pointer;
    border: 3px solid var(--wood-rim); background: linear-gradient(#cdb68e, #e3d3b5); box-shadow: inset 0 2px 4px rgba(110,67,32,.35); transition: background .15s; }
  .sw::before { content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, var(--wood-hi)); box-shadow: 0 2px 0 var(--wood-rim); transition: left .15s; }
  .sw:checked { border-color: var(--leaf-rim); background: linear-gradient(var(--leaf), var(--leaf-hi)); }
  .sw:checked::before { left: 24px; }
  /* a volume slider: a carved groove, leaf green up to the knob (--v, set by settings.ts) */
  .opt.volrow { cursor: default; }
  .opt.volrow > label { flex: 0 0 36%; cursor: pointer; }
  .vol { appearance: none; -webkit-appearance: none; flex: 1; min-width: 70px; height: 14px; margin: 0; border-radius: 7px; cursor: pointer;
    border: 3px solid var(--wood-rim); box-shadow: inset 0 2px 3px rgba(110,67,32,.35);
    background: linear-gradient(90deg, var(--leaf) 0 var(--v, 100%), #d8c4a0 var(--v, 100%)); }
  .vol::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 24px; height: 24px; border-radius: 50%;
    border: 2px solid var(--wood-rim); background: radial-gradient(circle at 35% 30%, #fff, var(--wood-hi)); box-shadow: 0 2px 0 var(--wood-rim); }
  .vol::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%;
    border: 2px solid var(--wood-rim); background: radial-gradient(circle at 35% 30%, #fff, var(--wood-hi)); box-shadow: 0 2px 0 var(--wood-rim); }
  .vol:disabled { opacity: .45; cursor: default; }
  .card .share { text-shadow: none; color: var(--ink); max-width: none; }
  .card .privacy { margin-top: -8px; color: var(--wood-lo); }
  /* the brief's rival card */
  .rival { display: flex; align-items: center; gap: 12px; margin: 14px auto 4px; padding: 8px 14px; border-radius: 14px; max-width: 28em; text-align: left; background: rgba(200,64,42,.08); }
  .rival.boss { background: rgba(242,176,30,.18); box-shadow: inset 0 0 0 2px rgba(200,64,42,.3); }
  .rival .pic { position: relative; flex: none; width: clamp(48px, 11vmin, 64px); padding-top: 4px; }
  .rival .face { display: block; width: 100%; height: auto; }
  .rival .crown { position: absolute; left: 50%; top: -10px; width: 62%; transform: translateX(-50%); }
  .rival .who { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .rival b { font-weight: inherit; font-size: clamp(17px, 3.8vmin, 22px); color: #a8321e; }
  .rival span { font-size: clamp(13px, 3vmin, 16px); }
  .rival i { font-style: normal; font-size: clamp(13px, 3vmin, 16px); opacity: .8; }
  /* the campaign's Normal / Hard tabs: on Hard the stages are dark wood */
  .stages.hard .stage:not(.boss):not(:disabled) { color: #fff6e2; text-shadow: 0 2px 0 var(--ink); background: var(--gloss), var(--grain), linear-gradient(#a8743d, #6e4320); border-color: #3b2412; box-shadow: 0 4px 0 #3b2412; }
  .stages.hard .stage:not(.boss):not(:disabled) .st .off { color: rgba(255,255,255,.35); }
  .share { display: flex; align-items: center; gap: 8px; max-width: 420px; font-size: clamp(12px, 2.6vmin, 15px); opacity: .92; cursor: pointer; text-align: left; text-shadow: 0 1px 0 var(--ink); }
  .privacy { margin-top: -6px; font-size: clamp(11px, 2.3vmin, 13px); color: var(--wood-hi); opacity: .9; }
  .share input { width: 18px; height: 18px; margin: 0; flex: none; accent-color: var(--leaf); cursor: pointer; }
  #online .card { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  #online .card h2 { margin: 0; }
  #onlineMsg { min-height: 1.3em; white-space: pre-line; }
  #onlineForm { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  #roomCode { font-size: clamp(56px, 14vmin, 96px); letter-spacing: 12px; color: var(--gold); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink); line-height: 1; }
  #codeIn {
    font: inherit; font-size: clamp(22px, 5vmin, 30px); width: 5.2em; text-align: center; letter-spacing: 6px; text-transform: uppercase;
    padding: 8px 10px; border-radius: 14px; border: 3px solid var(--wood-rim); background: #fffaf0; color: var(--ink); outline: none;
    box-shadow: inset 0 3px 6px rgba(110,67,32,.3);
    -webkit-user-select: text; user-select: text; touch-action: auto;
  }
  #codeIn::placeholder { color: rgba(59,36,18,.35); letter-spacing: 2px; }
  .row.join { align-items: center; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .st { color: var(--star); letter-spacing: 1px; }
  .panel > .sub .st, .btn .st { text-shadow: 0 1px 0 var(--ink); }
  .st .off { color: rgba(110,67,32,.28); }
  .btn .st .off, .panel > .sub .st .off { color: rgba(255,255,255,.35); }
  .chapRow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .chapRow h2 { margin: 0 0 2px; }
  #boardBtn { display: inline-flex; align-items: center; gap: 8px; }
  #boardBtn svg { width: 1.3em; height: 1.3em; flex: none; }
  #boardList { list-style: none; margin: 14px 0 18px; padding: 0; min-height: 3em; max-height: 46vh; overflow-y: auto; text-align: left; }
  #boardList li { display: flex; gap: 10px; align-items: center; padding: 6px 12px; border-radius: 10px; }
  #boardList li:nth-child(odd) { background: rgba(120, 72, 30, .09); }
  #boardList li b { min-width: 2em; text-align: right; color: var(--wood-lo); }
  #boardList li span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #boardList li i { font-style: normal; color: var(--gold-rim); font-weight: 800; }
  #boardList li.note { justify-content: center; background: none; opacity: .75; }
  .arrow { font: inherit; font-size: 20px; width: 48px; height: 48px; flex: none; border-radius: 50%; border: 3px solid var(--wood-rim); color: var(--ink); cursor: pointer;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.45), rgba(255,255,255,0) 45%), radial-gradient(circle, var(--wood-hi), var(--wood) 72%); box-shadow: 0 4px 0 var(--wood-rim); }
  .arrow:disabled { opacity: .3; cursor: default; }
  .stage svg.lock { width: 1.1em; height: 1.1em; opacity: .75; }
  .stages { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 16px 0; }
  .stage { font: inherit; font-size: clamp(18px, 4vmin, 24px); color: var(--ink); border: 3px solid var(--wood-rim); border-radius: 14px; padding: 8px 4px 6px; cursor: pointer;
    background: var(--gloss), var(--grain), linear-gradient(var(--wood-hi), var(--wood));
    box-shadow: 0 4px 0 var(--wood-rim); display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .stage.boss { color: #fff; border-color: #6b1d0c; background: var(--gloss), linear-gradient(#f2795c, #c8402a); box-shadow: 0 4px 0 #6b1d0c; text-shadow: 0 2px 0 #6b1d0c; }
  .stage:disabled { color: rgba(59,36,18,.4); background: linear-gradient(#e3d3b5, #cdb68e); border-color: #a08a66; box-shadow: 0 4px 0 #a08a66; cursor: default; text-shadow: none; }
  .stage .st { font-size: 14px; }
  .stage.boss .st .off { color: rgba(255,255,255,.4); }
  .stage:active:not(:disabled) { transform: translateY(3px); box-shadow: none; }
  .twists, .goals { list-style: none; padding: 0; margin: 12px 0; text-align: left; font-size: clamp(14px, 3.4vmin, 18px); line-height: 1.4; }
  .twists li::before { content: '⚑ '; color: #c8402a; }
  .goals li::before { content: '★ '; color: var(--star); }
  .goals li.off::before { color: rgba(110,67,32,.3); }
  .tip { font-size: clamp(13px, 3vmin, 16px); opacity: .9; font-style: italic; margin: 4px auto 10px; max-width: 30em; line-height: 1.35; }
  .panel > .tip { text-shadow: 0 1px 0 var(--ink), 0 0 6px rgba(0,0,0,.6); }
  .stars { display: flex; gap: 18px; justify-content: center; }
  .stars div { display: flex; flex-direction: column; align-items: center; font-size: clamp(12px, 2.6vmin, 15px); opacity: .95; min-width: 80px; text-shadow: 0 1px 0 var(--ink); }
  .stars b { font-size: clamp(40px, 9vmin, 60px); font-weight: 400; line-height: 1; color: rgba(255,255,255,.2); }
  .stars .had b { color: rgba(242,176,30,.5); }
  .stars .on b { color: var(--star); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 0 3px 0 var(--ink); }
</style>
</head>
<body>

<div id="menu" class="panel hidden">
  <div class="title"><img class="l" src="ui/guard_blue.webp" alt=""><div class="logo">HEXFRONT <span>RUSH</span></div><img class="r" src="ui/ogre_red.webp" alt=""></div>
  <div class="sub" id="record"></div>
  <button class="btn" id="playBtn"></button>
  <div class="row">
    <button class="btn wood" id="quickBtn" data-t="quick"></button>
    <button class="btn small" id="diffBtn"></button>
    <button class="btn wood" id="achBtn" aria-label="Achievements"><svg class="medal" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2h4l2 6H9zM13 2h4l-2 6h-4z" fill="#c8402a"/><circle cx="12" cy="15" r="7" fill="var(--gold)" stroke="var(--gold-rim)" stroke-width="1.6"/><path d="M12 11l1.2 2.5 2.7.3-2 1.9.6 2.7L12 17l-2.5 1.4.6-2.7-2-1.9 2.7-.3z" fill="#fff6e2"/></svg><span id="achN"></span></button>
    <button class="btn wood icon" id="setBtn" aria-label="Settings"><svg class="gear" viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" fill="currentColor" d="M10.3 2h3.4l.5 2.6 1.9.8 2.2-1.5 2.4 2.4-1.5 2.2.8 1.9 2.6.5v3.4l-2.6.5-.8 1.9 1.5 2.2-2.4 2.4-2.2-1.5-1.9.8-.5 2.6h-3.4l-.5-2.6-1.9-.8-2.2 1.5-2.4-2.4 1.5-2.2-.8-1.9L2 13.7v-3.4l2.6-.5.8-1.9-1.5-2.2 2.4-2.4 2.2 1.5 1.9-.8zM12 8.4a3.6 3.6 0 1 0 0 7.2 3.6 3.6 0 1 0 0-7.2z"/></svg></button>
  </div>
  <div class="row">
    <button class="btn wood" id="dailyBtn"></button>
    <button class="btn wood" id="onlineBtn" data-t="online"></button>
    <button class="btn wood" id="howBtn" data-t="howto"></button>
  </div>
</div>

<div id="campaign" class="panel hidden">
  <div class="card">
    <div class="tabs hidden" id="modeTabs"><button class="tab on" id="modeNormal" data-t="diff1"></button><button class="tab" id="modeHard" data-t="diff2"></button></div>
    <div class="chapRow">
      <button class="arrow" id="chPrev" aria-label="Previous chapter">◀</button>
      <div><h2 id="chName"></h2><div class="sub st" id="chStars"></div></div>
      <button class="arrow" id="chNext" aria-label="Next chapter">▶</button>
    </div>
    <div class="stages" id="stageGrid"></div>
    <div class="row">
      <button class="btn wood" id="campBack" data-t="menu"></button>
      <button class="btn small hidden" id="boardBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18M5 20v-6h4v6M10 20V8h4v12M15 20v-9h4v9" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg><span data-t="leaderboard"></span></button>
    </div>
  </div>
</div>

<div id="board" class="panel hidden">
  <div class="card">
    <h2 data-t="leaderboard"></h2>
    <div class="tabs"><button class="tab on" id="boardStars" data-t="boardStars"></button><button class="tab" id="boardDaily" data-t="boardDaily"></button></div>
    <div class="sub" id="boardSub"></div>
    <ol id="boardList"></ol>
    <button class="btn wood" id="boardBack" data-t="back"></button>
  </div>
</div>

<div id="brief" class="panel hidden">
  <div class="card">
    <h2 id="briefTitle"></h2>
    <div class="sub" id="briefSub"></div>
    <div class="sub hidden" id="briefBest"></div>
    <div class="rival" id="briefRival"></div>
    <ul class="twists" id="briefTwists"></ul>
    <ul class="goals" id="briefGoals"></ul>
    <div class="tip" id="briefTip"></div>
    <button class="btn small boost hidden" id="boostBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M10 9v6l5-3z" fill="currentColor"/></svg><span></span></button>
    <div class="row">
      <button class="btn" id="briefGo" data-t="go"></button>
      <button class="btn wood" id="briefBack" data-t="back"></button>
    </div>
  </div>
</div>

<div id="online" class="panel hidden">
  <div class="card">
    <h2 data-t="online"></h2>
    <div class="sub" id="onlineMsg"></div>
    <div id="roomCode" class="hidden"></div>
    <div id="onlineForm">
      <button class="btn" id="createBtn" data-t="createRoom"></button>
      <div class="row join">
        <input id="codeIn" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text">
        <button class="btn wood" id="joinBtn" data-t="join"></button>
      </div>
    </div>
    <button class="btn wood" id="onlineBack" data-t="cancel"></button>
  </div>
</div>

<div id="howto" class="panel hidden">
  <div class="card">
    <h2 data-t="howto"></h2>
    <div class="howScroll"><ol>
      <li data-t="how1"></li>
      <li data-t="how2"></li>
      <li data-t="how3"></li>
      <li data-t="how4"></li>
      <li data-t="how5"></li>
    </ol></div>
    <button class="btn" id="howtoOk" data-t="gotit"></button>
  </div>
</div>

<div id="result" class="panel hidden">
  <div class="card res">
    <div class="resL">
    <div class="sub" id="resultReason"></div>
    <h1 id="resultTitle"></h1>
    <div class="score">
      <div class="chip b" id="chipMe"><span id="resMe">0</span><small data-t="you"></small></div>
      <div class="chip r" id="chipFoe"><span id="resFoe">0</span><small data-t="rival"></small></div>
    </div>
    <div class="sub hidden" id="resTime"></div>
    <div class="stars hidden" id="resStars"></div>
    </div>
    <div class="resR">
    <table class="stats" id="resStats"></table>
    <div class="tip hidden" id="resTip"></div>
    <div class="row">
      <button class="btn hidden" id="nextBtn" data-t="nextStage"></button>
      <button class="btn" id="againBtn" data-t="playAgain"></button>
      <button class="btn wood" id="menuBtn" data-t="menu"></button>
    </div>
    <button class="btn wood hidden" id="watchBtn" data-t="watchReplay"></button>
    <div class="achNew hidden" id="resAch"></div>
    </div>
  </div>
</div>

<div id="pause" class="panel hidden">
  <div class="card narrow">
    <h2 data-t="paused"></h2>
    <div class="col">
      <button class="btn" id="pResume" data-t="resume"></button>
      <button class="btn wood" id="pRestart" data-t="restart"></button>
      <button class="btn wood" id="pMenu" data-t="menu"></button>
    </div>
  </div>
</div>

<div id="settings" class="panel hidden">
  <div class="card narrow">
    <h2 data-t="settings"></h2>
    <div class="opts">
      <div class="opt volrow"><label for="optSfx" id="lblSfx" data-t="optSound"></label><input type="range" class="vol" id="optSfxVol" min="0" max="100" step="5" aria-labelledby="lblSfx"><input type="checkbox" class="sw" id="optSfx"></div>
      <div class="opt volrow"><label for="optMusic" id="lblMusic" data-t="optMusic"></label><input type="range" class="vol" id="optMusicVol" min="0" max="100" step="5" aria-labelledby="lblMusic"><input type="checkbox" class="sw" id="optMusic"></div>
      <label class="opt hidden" id="optVibRow"><span data-t="optVibrate"></span><input type="checkbox" class="sw" id="optVib"></label>
      <div class="opt q"><span data-t="optGraphics"></span>
        <div class="tabs" id="optQuality"><button class="tab" data-q="0" data-t="qAuto"></button><button class="tab" data-q="1" data-t="qHigh"></button><button class="tab" data-q="2" data-t="qSaver"></button></div>
      </div>
      <label class="share hidden" id="share"><input type="checkbox" id="shareIn"><span data-t="shareReplays"></span></label>
      <a class="privacy hidden" id="privacyLink" target="_blank" rel="noopener" data-t="privacy"></a>
    </div>
    <button class="btn wood" id="setBack" data-t="back"></button>
  </div>
</div>

<div id="ach" class="panel hidden">
  <div class="card">
    <h2 data-t="achievements"></h2>
    <div class="sub st" id="achSub"></div>
    <div class="achGrid" id="achGrid"></div>
    <button class="btn wood" id="achBack" data-t="back"></button>
  </div>
</div>

<button id="muteBtn" aria-label="Sound">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>
    <path class="w" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>
    <path class="x" d="M16 9l6 6M22 9l-6 6"/>
  </svg>
</button>

<button id="musicBtn" class="hidden" aria-label="Music">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <g class="n"><path d="M9 17V5l10-2v12"/><circle cx="6.5" cy="17.5" r="2.8" fill="currentColor"/><circle cx="16.5" cy="15.5" r="2.8" fill="currentColor"/></g>
    <path class="x" d="M3 3l18 18"/>
  </svg>
</button>

<button id="pauseBtn" class="hidden" aria-label="Pause">
  <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4.2" height="14" rx="1.4"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.4"/></svg>
</button>

<button id="leaveBtn" class="hidden" aria-label="Leave">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 21V4"/><path d="M5 4h12l-2.5 4L17 12H5" fill="#ef5a3c"/>
  </svg>
</button>

<button id="speedBtn" class="hidden" aria-label="Replay speed">1×</button>

<div id="loading"><div class="logo">HEXFRONT <span>RUSH</span></div><div class="bar"><i></i></div></div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
